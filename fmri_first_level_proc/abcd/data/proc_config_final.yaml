# ============================================================================
# fmri_first_level_proc ANALYSIS TEMPLATE FOR THE ABCD FIRST-LEVEL PIPELINE
# ============================================================================
#
# abcd/staging.py fills a copy of this per session and runs
# `fmri-first-level-proc --config <copy> --analyses <i>` once per block. It sets
# only the atlas, num_cores when `auto`, paths, run_labels, out_dir and the three
# output prefixes; every analysis setting below is used as written. The /path/to/
# values are placeholders it replaces. Each block's `name` must have a prefix rule
# in staging.ANALYSES.
#
# ============================================================================

# --------------------------------------------------------------------------
# GLOBAL SETTINGS
# --------------------------------------------------------------------------
# These values apply uniformly to all analysis blocks. They cannot be
# overridden per-block.

global:
  num_cores: auto                # resolved per pod: OMP_NUM_THREADS (the CPU request, see the template), capped at the cgroup limit
  tr: 0.8                        # Repetition time in seconds; the stager refuses a BOLD whose TR differs
  template_path: "/path/to/atlas.nii.gz"        # Path to shared ROI template (.nii.gz), or null
  force_diff_atlas: true        # true = allow atlas mismatch (USE WITH CAUTION)

# --------------------------------------------------------------------------
# ANALYSIS BLOCKS
# --------------------------------------------------------------------------
# Each entry is one analysis to run. They execute in order (top to bottom).

analyses:

  # ========================================================================
  # TASK ACTIVATION (type: task_act)
  # ========================================================================
  # Runs first-level regression with 3dDeconvolve, optionally extracts
  # condition/contrast-specific maps and parcel-level statistics.
  - name: "nback_act"
    type: "task_act"

    # -- Per-analysis censoring parameters --
    fd_threshold: 0.9            # Framewise displacement threshold (mm) for censoring
    censor_prev_tr: false        # true = also censor the TR before a high-motion TR

    # -- Per-participant input file paths (one entry per run; the stager also sets run_labels) --
    paths:
      scan_paths:
        - "/path/to/subj001_nback_run1.nii.gz"
      task_timing_paths:
        - "/path/to/subj001_nback_run1_events.tsv"
      motion_paths:
        - "/path/to/subj001_nback_run1_motion.txt"
      CSF_paths: null            # mean CSF BOLD signal per TR, or null
      WM_paths: null             # mean WM BOLD signal per TR, or null

    # -- Output settings --
    out_dir: "/path/to/output/subj001/nback_act"
    out_file_pre: "subj001_nback_baseline"

    # -- Condition labels (must match CONDITION column in timing CSV) --
    # target_0back pools the 0-back cues across stimuli; a session has 2 per stimulus.
    cond_labels: ["0_back_negface","0_back_posface","0_back_neutface","0_back_place","2_back_negface","2_back_posface","2_back_neutface","2_back_place","target_0back","instruction"]

    # -- Block settings --
    remove_previous: false       # true = delete all files in out_dir before running
    average_type: "mean"         # "mean" or "median" for parcel averaging
    hrf_model: "GAM"             # "GAM" | "BLOCK" | "dmBLOCK" | "SPMG1" | "custom"
    custom_hrf: null             # Required when hrf_model is "custom", e.g. "TENT(0,14,8)"
    include_motion_derivs: false # true = use first 12 columns (base + derivs); false = use first 6 columns only
    use_tissue_derivs: false     # true = include first temporal derivatives of tissue signals (CSF/WM) as additional regressors
    scale_to_psc: true           # true = scale BOLD to percent signal change before regression (3.1.0 default; v2.5.0 did not scale)

    # -- Contrasts --
    # functions: null = disabled; list of equations = enabled
    contrasts:
      functions:
        - "0.5*0_back_negface+0.5*2_back_negface"
        - "0.5*0_back_posface+0.5*2_back_posface"
        - "0.5*0_back_neutface+0.5*2_back_neutface"
        - "0.5*0_back_place+0.5*2_back_place"
        - "0.25*0_back_negface+0.25*0_back_posface+0.25*0_back_neutface+0.25*0_back_place"
        - "0.25*2_back_negface+0.25*2_back_posface+0.25*2_back_neutface+0.25*2_back_place"
        - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_posface-0.5*2_back_posface"
        - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_neutface-0.5*2_back_neutface"
        - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_place-0.5*2_back_place"
        - "0.5*0_back_posface+0.5*2_back_posface-0.5*0_back_neutface-0.5*2_back_neutface"
        - "0.5*0_back_posface+0.5*2_back_posface-0.5*0_back_place-0.5*2_back_place"
        - "0.5*0_back_neutface+0.5*2_back_neutface-0.5*0_back_place-0.5*2_back_place"
        - "0.25*2_back_negface+0.25*2_back_posface+0.25*2_back_neutface+0.25*2_back_place-0.25*0_back_negface-0.25*0_back_posface-0.25*0_back_neutface-0.25*0_back_place"
        - "1*2_back_negface-1*0_back_negface"
        - "1*2_back_posface-1*0_back_posface"
        - "1*2_back_neutface-1*0_back_neutface"
        - "1*2_back_place-1*0_back_place"
        - "1*0_back_negface-1*0_back_posface"
        - "1*0_back_negface-1*0_back_neutface"
        - "1*0_back_negface-1*0_back_place"
        - "1*0_back_posface-1*0_back_neutface"
        - "1*0_back_posface-1*0_back_place"
        - "1*0_back_neutface-1*0_back_place"
        - "1*2_back_negface-1*2_back_posface"
        - "1*2_back_negface-1*2_back_neutface"
        - "1*2_back_negface-1*2_back_place"
        - "1*2_back_posface-1*2_back_neutface"
        - "1*2_back_posface-1*2_back_place"
        - "1*2_back_neutface-1*2_back_place"

      labels:
        - "ave_negface"
        - "ave_posface"
        - "ave_neutface"
        - "ave_place"
        - "ave_zback"
        - "ave_tback"
        - "ave_negface-ave_posface"
        - "ave_negface-ave_neutface"
        - "ave_negface-ave_place"
        - "ave_posface-ave_neutface"
        - "ave_posface-ave_place"
        - "ave_neutface-ave_place"
        - "ave_tback-ave_zback"
        - "negface_tback-zback"
        - "posface_tback-zback"
        - "neutface_tback-zback"
        - "place_tback-zback"
        - "zback_negface-posface"
        - "zback_negface-neutface"
        - "zback_negface-place"
        - "zback_posface-neutface"
        - "zback_posface-place"
        - "zback_neutface-place"
        - "tback_negface-posface"
        - "tback_negface-neutface"
        - "tback_negface-place"
        - "tback_posface-neutface"
        - "tback_posface-place"
        - "tback_neutface-place"

    # -- Extraction --
    extraction:
      # Every condition and contrast, one multi-sub-brick NIfTI + index JSON +
      # parcellated CSV per stat type. Betas feed group analysis (3dMEMA takes
      # Coef + Tstat). Zstat is kept because df (uncensored TRs minus
      # regressors) differs per subject, so T is not on a common scale across
      # subjects, and the parcellated CSVs carry no df to convert it later.
      stat_buckets: ["Coef", "Tstat", "Zstat"]  # valid: "Coef", "Tstat", "Fstat", "R^2", "Zstat"; null = disabled
      extract_out_file_pre: "subj001_nback_baseline_Shen368"
      extract_resids: true      # true = extract residuals as well as stats
      extract_raw_ptseries: true  # true = extract pre-regression parcellated time series (requires template_path and extract_out_file_pre)

  # ========================================================================
  # TASK CONNECTIVITY (type: task_conn)
  # ========================================================================
  # Generates beta series via 3dLSS, optionally extracts parcel-level beta
  # series, and optionally computes functional connectivity.
  - name: "nback_conn"
    type: "task_conn"

    # -- Per-analysis censoring parameters --
    fd_threshold: 0.9            # Framewise displacement threshold (mm) for censoring
    censor_prev_tr: false        # true = also censor the TR before a high-motion TR

    paths:
      scan_paths:
        - "/path/to/subj001_nback_run1.nii.gz"
      task_timing_paths:
        - "/path/to/subj001_nback_run1_events.tsv"
      motion_paths:
        - "/path/to/subj001_nback_run1_motion.txt"
      CSF_paths: null            # mean CSF BOLD signal per TR, or null
      WM_paths: null             # mean WM BOLD signal per TR, or null

    out_dir: "/path/to/output/subj001/nback_conn"
    out_file_pre: "subj001_nback_baseline"

    # -- Condition beta labels --
    # Conditions for which trial-level beta series will be estimated. target_0back and
    # instruction are modelled as nuisance regressors, because they are absent from this list.
    cond_beta_labels: ["0_back_negface","0_back_posface","0_back_neutface","0_back_place","2_back_negface","2_back_posface","2_back_neutface","2_back_place"]

    # -- Block settings --
    remove_previous: false       # true = delete all files in out_dir before running
    average_type: "mean"         # "mean" or "median" for parcel averaging
    hrf_model: "GAM"             # "GAM" | "BLOCK" | "dmBLOCK" | "SPMG1" | "custom"
    custom_hrf: null             # Required when hrf_model is "custom", e.g. "TENT(0,14,8)"
    include_motion_derivs: false # true = use first 12 columns (base + derivs); false = use first 6 columns only
    use_tissue_derivs: false     # true = include first temporal derivatives of tissue signals (CSF/WM) as additional regressors
    scale_to_psc: true           # true = scale BOLD to percent signal change before regression (3.1.0 default; v2.5.0 did not scale)

    # -- Extraction --
    extraction:
      extract_pbseries: true     # true = extract parcel beta series, false = skip
      extract_out_file_pre: "subj001_nback_baseline_Shen368"
      extract_raw_ptseries: true  # true = extract pre-regression parcellated time series (requires template_path and extract_out_file_pre)

    # -- Connectivity --
    connectivity:
      calc_conn: "parcellated"   # null = disabled; "seed_to_voxel" | "parcellated" = enabled
      conn_out_file_pre: "subj001_nback_baseline_Shen368"
      pcorr: false               # use partial correlation
      fishZ: true                # use Fisher Z transform on correlation coefficients

      # -- Contrasts --
      # functions: null = disabled; list of equations = enabled
      contrasts:
        functions:
          - "0.5*0_back_negface+0.5*2_back_negface"
          - "0.5*0_back_posface+0.5*2_back_posface"
          - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_posface-0.5*2_back_posface"
          - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_neutface-0.5*2_back_neutface"
          - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_place-0.5*2_back_place"
          - "0.5*0_back_posface+0.5*2_back_posface-0.5*0_back_neutface-0.5*2_back_neutface"
          - "0.5*0_back_posface+0.5*2_back_posface-0.5*0_back_place-0.5*2_back_place"
          - "1*0_back_negface-1*0_back_posface"
          - "1*0_back_negface-1*0_back_neutface"
          - "1*0_back_negface-1*0_back_place"
          - "1*0_back_posface-1*0_back_neutface"
          - "1*0_back_posface-1*0_back_place"
          - "1*2_back_negface-1*2_back_posface"
          - "1*2_back_negface-1*2_back_neutface"
          - "1*2_back_negface-1*2_back_place"
          - "1*2_back_posface-1*2_back_neutface"
          - "1*2_back_posface-1*2_back_place"

        labels:
          - "ave_negface"
          - "ave_posface"
          - "ave_negface-ave_posface"
          - "ave_negface-ave_neutface"
          - "ave_negface-ave_place"
          - "ave_posface-ave_neutface"
          - "ave_posface-ave_place"
          - "zback_negface-posface"
          - "zback_negface-neutface"
          - "zback_negface-place"
          - "zback_posface-neutface"
          - "zback_posface-place"
          - "tback_negface-posface"
          - "tback_negface-neutface"
          - "tback_negface-place"
          - "tback_posface-neutface"
          - "tback_posface-place"

  # ========================================================================
  # RESTING-STATE CONNECTIVITY (type: rest_conn)
  # ========================================================================
  # Generates residual time series via 3dTproject, optionally extracts
  # parcel-level time series, and optionally computes functional connectivity.
  # NOTE: rest_conn uses lists for paths (one entry per run).
  - name: "rest_conn"
    type: "rest_conn"

    # -- Per-analysis censoring parameters --
    fd_threshold: 0.4            # Framewise displacement threshold (mm) for censoring
    censor_prev_tr: true         # true = also censor the TR before a high-motion TR

    # -- Per-run input file paths (all lists must be the same length) --
    paths:
      scan_paths:
        - "/path/to/subj001_rest_run1.nii.gz"
        - "/path/to/subj001_rest_run2.nii.gz"
      motion_paths:
        - "/path/to/subj001_rest_run1_motion.txt"
        - "/path/to/subj001_rest_run2_motion.txt"
      CSF_paths:
        - "/path/to/subj001_rest_run1_CSF.txt"
        - "/path/to/subj001_rest_run2_CSF.txt"
      WM_paths:
        - "/path/to/subj001_rest_run1_WM.txt"
        - "/path/to/subj001_rest_run2_WM.txt"
      # Placeholder only: the stager always passes one global_signal file per run
      # (GSR on), as the retired orchestrator did whatever this said.
      GS_paths: null             # null = no global signal regression; list of paths = enable GSR

    out_dir: "/path/to/output/subj001/rest_conn"
    out_file_pre: "subj001_rest_baseline"

    # -- Block settings --
    remove_previous: false       # true = delete all files in out_dir before running
    average_type: "mean"         # "mean" or "median" for parcel averaging
    bandpass: [0.01, 0.1]        # Required: [low, high] Hz
    notch_filter_band: [0.31, 0.43]  # Respiration notch filter Hz band (null = disabled)
    motion_deriv_degree: 2       # Required: number of derivative orders (total motion cols = 6 * degree); e.g. 2 = base + 1st derivs = 12 cols
    keep_run_res_dtseries: false  # true = keep all run-specific dtseries (false to save space)
    use_tissue_derivs: true     # true = include first temporal derivatives of tissue signals (CSF/WM/GS) as additional regressors
    scale_to_psc: true           # true = scale BOLD to percent signal change before regression (3.1.0 default; v2.5.0 did not scale)

    # -- Extraction --
    extraction:
      extract_ptseries: true     # true = extract parcel time series, false = skip
      extract_out_file_pre: "subj001_rest_baseline_Shen368"
      extract_raw_ptseries: true  # true = extract pre-regression parcellated time series per run (requires template_path and extract_out_file_pre)

    # -- Connectivity --
    connectivity:
      calc_conn: "parcellated"   # null = disabled; "seed_to_voxel" | "parcellated" = enabled
      conn_out_file_pre: "subj001_rest_baseline_R_amyg"
      pcorr: false               # use partial correlation
      fishZ: true                # use Fisher Z transform on correlation coefficients
