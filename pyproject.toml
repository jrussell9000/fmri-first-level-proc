[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-first-level-proc"
version = "4.0.0+cp.7"
description = "General-purpose first-level fMRI analysis framework built on AFNI."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Taylor J. Keding, Ph.D." },
]

dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pyyaml",
    "packaging",
]

[project.optional-dependencies]
dev = ["pytest"]
abcd = ["nibabel"]

[project.scripts]
fmri-first-level-proc = "fmri_first_level_proc.run_first_level:main"
fmri-first-level-abcd = "fmri_first_level_proc.abcd.staging:main"
fmri-first-level-abcd-validity = "fmri_first_level_proc.abcd.validity:main"

[tool.setuptools.packages.find]
include = ["fmri_first_level_proc*"]

[tool.setuptools.package-data]
fmri_first_level_proc = ["tools.lock.yaml"]
"fmri_first_level_proc.abcd" = ["data/*.yaml", "data/atlas/*"]

[tool.pytest.ini_options]
markers = [
    "level0_unit: Pure-function unit tests",
    "level1_internal_integration: Cross-function integration within a module",
    "level2_tool_equivalence: Verify tool wrapper output matches known reference",
    "level3_checkpoint: Checkpoint/resume round-trip",
    "level4_stage_integration: Single pipeline stage end-to-end",
    "level5_adversarial: Edge cases, malformed input, boundary conditions",
    "level6_cross_stage: Multi-stage integration",
    "level7_pipeline: Full pipeline end-to-end",
    "afni: Requires a real AFNI installation (skipped without one)",
]
