[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-first-level-proc"
dynamic = ["version"]
description = "General-purpose first-level fMRI analysis framework built on AFNI."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Taylor J. Keding, Ph.D." },
]

dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
fmri-first-level-proc = "fmri_first_level_proc.cli:main"
run-first-level = "fmri_first_level_proc.cli:_main_deprecated"

[tool.setuptools.dynamic]
version = { attr = "fmri_first_level_proc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fmri_first_level_proc = ["data/*.yaml"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecations (e.g. pandas' Pandas4Warning) fail the suite instead of scrolling past
filterwarnings = ["error"]
markers = [
    "level0_unit: Pure-function unit tests",
    "level1_internal_integration: Cross-function integration within a module",
    "level2_tool_equivalence: Verify tool wrapper output matches known reference",
    "level3_manifest: Run manifest rerun/resume behavior",
    "level4_stage_integration: Single pipeline stage end-to-end",
    "level5_adversarial: Edge cases, malformed input, boundary conditions",
    "level6_cross_stage: Multi-stage integration",
    "level7_pipeline: Full pipeline end-to-end",
    "afni: Requires a real AFNI installation (skipped without one); see tests/test_real_afni.py",
]
