name: Upstream watch

# A failed run is the flag: upstream or the orchestrator has moved past the commits this
# repository records. FORK.md says what to do.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: upstream and orchestrator match the recorded commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the recorded commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_upstream_changes.py
